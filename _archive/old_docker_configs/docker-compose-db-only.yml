version: '3.8'

# ============================================================================
# Simplified Docker Compose - Oracle Database Only
# (ORDS can be installed separately or accessed via ORDS already running)
# ============================================================================

services:
  # =========================================================================
  # Oracle Database Free Edition (from Oracle Container Registry)
  # =========================================================================
  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: tourism-oracle-db
    hostname: oracle-db
    
    # Network configuration
    ports:
      - "1521:1521"      # SQL*Net listener
    
    # Environment variables
    environment:
      ORACLE_PWD: TourismDB2025!
      ORACLE_CHARACTERSET: AL32UTF8
    
    # Volumes for data persistence
    volumes:
      - oracle_data_volume:/opt/oracle/oradata
      - oracle_logs_volume:/opt/oracle/diag
    
    # Health check
    healthcheck:
      test: ["CMD", "sqlplus", "-S", "system/TourismDB2025!@FREEPDB1", "as", "sysdba", "SELECT 1 FROM dual;"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    
    # Resource limits
    mem_limit: 6g
    cpus: '2'
    
    restart: unless-stopped
    
    networks:
      - tourism-network

# ============================================================================
# Named Volumes
# ============================================================================
volumes:
  oracle_data_volume:
    driver: local
  
  oracle_logs_volume:
    driver: local

# ============================================================================
# Network
# ============================================================================
networks:
  tourism-network:
    driver: bridge
