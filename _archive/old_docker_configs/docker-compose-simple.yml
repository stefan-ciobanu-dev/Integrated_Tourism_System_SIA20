version: '3.8'

services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: tourism-oracle-db
    
    ports:
      - "1521:1521"
      - "5500:5500"
    
    environment:
      ORACLE_PASSWORD: TourismDB2025!
    
    volumes:
      - oracle_data:/opt/oracle/oradata
    
    restart: no

volumes:
  oracle_data:

networks:
  default:
    name: tourism-network
