### REST Data HTTP service
server.port=8090
server.servlet.context-path=/DSA-SQL-JPAService/rest

### JPA Persistence Unit — PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/tourism
spring.datasource.username=tourism_user
spring.datasource.password=tourism_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=tourism

### logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.level.org.hibernate.SQL=info

# SpringBoot Security
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
spring.security.user.name=developer
spring.security.user.password=iis
