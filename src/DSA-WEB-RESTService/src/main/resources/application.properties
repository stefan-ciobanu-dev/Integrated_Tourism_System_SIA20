### REST Data HTTP service
server.port=8096
server.servlet.context-path=/DSA-WEB-RESTService/rest
server.servlet.jsp.registered=false

### JPA Persistence Unit — SparkSQL via Hive JDBC
spring.datasource.url=jdbc:hive2://localhost:10000/default
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.apache.hive.jdbc.HiveDriver

spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5

# Do not run SQL init scripts (no schema to initialize in Hive)
spring.sql.init.mode=never

# Do not validate JDBC metadata on startup — avoids eager connection to Hive
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

### logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.level.org.hibernate.SQL=info

# SpringBoot Security
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
spring.security.user.name=developer
spring.security.user.password=iis
